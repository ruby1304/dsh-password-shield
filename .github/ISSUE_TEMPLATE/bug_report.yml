name: Bug report
description: Report a reproducible dsh-password-shield problem without private page data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, session text, local paths, browser-profile data or extension storage.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: DSH, browser and extension versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use minimal generated HTML or DOM steps, not a real conversation page dump.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
